name: Build ESP32 Project

on: [push, pull_request]

jobs:
  build-esp32:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Crear secrets.cpp
      run: |
        echo '#include "secrets.h"' > src/secrets.cpp
        echo "const char* ssid = \"${{ secrets.WIFI_SSID }}\";" >> src/secrets.cpp
        echo "const char* password = \"${{ secrets.WIFI_PASSWORD }}\";" >> src/secrets.cpp
        echo "const char* api_url = \"${{ secrets.API_URL }}\";" >> src/secrets.cpp
        echo "const char* api_key = \"${{ secrets.API_KEY }}\";" >> src/secrets.cpp

    - name: Compile for ESP32 (without uploading)
      run: pio run -e esp32dev
